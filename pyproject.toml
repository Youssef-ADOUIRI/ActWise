[project]
name = "actwise"
version = "0.1.0"
description = "Citation-grounded assistant for the EU AI Act and GDPR"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "beautifulsoup4",
    "fastapi",
    "httpx",
    "lxml",
    "numpy",
    "openai",
    "pydantic",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "uvicorn[standard]",
]

[project.optional-dependencies]
local = ["sentence-transformers", "qdrant-client"]
cloud = ["onnxruntime", "tokenizers", "qdrant-client", "huggingface-hub"]
# Step 9: fine-tune (on Colab, see notebooks/), export to ONNX and quantize to int8
train = ["sentence-transformers[train]", "onnx", "onnxruntime", "onnxscript"]
ui = ["streamlit"]
# Step 10: the framework versions compared in frameworks/COMPARISON.md (not in the image)
frameworks = ["llama-index-core", "llama-index-embeddings-huggingface", "langgraph"]

[dependency-groups]
dev = [
    "hypothesis",
    "locust",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
    "scikit-learn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src", "."]  # the editable install also puts frameworks/ (step 10) on the path

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# D102, D103, D105, D107: every public function and method needs a docstring.
select = ["E", "F", "I", "B", "UP", "SIM", "D102", "D103", "D105", "D107"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a downloaded model",
    "integration: needs a running service (Qdrant, API)",
]

[tool.coverage.run]
source = ["src"]
# Thin I/O glue, checked by hand and smoke tests rather than unit tests.
omit = [
    "src/actwise/api/app.py",
    "src/actwise/retrieval/index.py",
    "src/actwise/integrations/slack_bot.py",
    "src/actwise/integrations/mcp_server.py",
    "src/actwise/integrations/sheets.py",
    "src/actwise/llm/smoke.py",
]
